<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCEEFD">
<title>Beam</title>
<meta name="description" content="A little light, sent your way.">

<!-- Open Graph: crawlers don't run JS, so this card is always the same image, whichever message the link opens. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Beam">
<meta property="og:title" content="Beam">
<meta property="og:description" content="A little light, sent your way.">
<meta property="og:image" content="https://lulu524724.github.io/beam-preview-assets/beam-og-image.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Beam">
<meta name="twitter:description" content="A little light, sent your way.">
<meta name="twitter:image" content="https://lulu524724.github.io/beam-preview-assets/beam-og-image.png?v=2">

<style>
  /* Same light blue "Send to Someone" look as the app (tokens: someoneThemes.blue). */
  @font-face{font-family:"Beam Plex";src:url("fonts/IBMPlexSansCondensed-Light.ttf") format("truetype");font-weight:300;font-display:swap}
  @font-face{font-family:"Beam Plex";src:url("fonts/IBMPlexSansCondensed-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
  :root{
    --bg:#DCEEFD;--ink:#12304D;--ink-soft:#3E5F80;--orb-center:#FFFFFF;--orb-mid:#DDEEFC;--orb-edge:#A9CFF0;--orb-ring:#3A6FA0;
    --action:#1A66B8;--action-text:#FFFFFF;--line:rgba(18,48,77,.3);--tint:rgba(18,48,77,.06);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  body{min-height:100vh;min-height:100dvh;font-family:"Beam Plex",sans-serif;font-weight:300;display:flex;justify-content:center;position:relative;overflow-x:hidden}
  main{width:100%;max-width:440px;padding:24px 16px 40px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
  .brand{align-self:flex-start;font-weight:400;font-size:24px;letter-spacing:.3px;margin:4px 0 0}
  .lead{font-size:18px;color:var(--ink-soft);margin:28px 0 20px;text-align:center}
  .orb{
    width:min(82vw,340px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:14%;
    background:radial-gradient(circle at 38% 32%,var(--orb-center) 0%,var(--orb-mid) 55%,var(--orb-edge) 100%);
    border:1.5px solid var(--orb-ring);
    box-shadow:0 0 0 22px rgba(255,255,255,.28),0 14px 32px rgba(18,48,77,.18),inset 0 0 0 7px rgba(255,255,255,.5);
  }
  .message{font-size:22px;line-height:1.35;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;max-height:100%;overflow:auto}
  .message.medium{font-size:19px}.message.long{font-size:16px}
  .note{font-size:15px;color:var(--ink-soft);margin-top:30px;text-align:center}
  .invite{width:100%;margin-top:28px;display:none}
  .invite.show{display:block}
  .keep{font-size:17px;text-align:center;margin:0 0 14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:999px;font:400 17px "Beam Plex",sans-serif;cursor:pointer}
  .primary{background:var(--action);color:var(--action-text);border:none}
  .provider{background:var(--tint);color:var(--ink);border:1px solid var(--line);margin-top:10px}
  .btn:active{opacity:.85}
  .btn svg{width:20px;height:20px;flex:none}
  #signup{display:none;margin-top:6px}
  #signupNote{display:none;font-size:15px;line-height:1.5;color:var(--ink-soft);margin-top:14px;text-align:center}
  /* A few soft lights, only in the bottom third. */
  .lights{position:fixed;left:0;right:0;bottom:0;height:33vh;pointer-events:none;z-index:0}
  .lights i{position:absolute;border-radius:50%;background:#fff;opacity:.8}
</style>
</head>
<body>
<div class="lights" aria-hidden="true"><i style="left:12%;top:40%;width:8px;height:8px"></i><i style="left:30%;top:70%;width:5px;height:5px"></i><i style="left:78%;top:30%;width:9px;height:9px"></i><i style="left:88%;top:78%;width:5px;height:5px"></i><i style="left:58%;top:88%;width:6px;height:6px"></i></div>
<main>
  <div class="brand">Beam</div>
  <p class="lead" id="lead">Someone sent you a little light.</p>
  <div class="orb"><div id="message" class="message">A little light, for you.</div></div>
  <p class="note" id="note" hidden></p>

  <!-- The invitation comes after the message, and is optional (DESIGN3 §3.5). -->
  <section class="invite" id="invite" aria-label="Keep this Beam">
    <p class="keep">Want to keep this, or send one back?</p>
    <button class="btn primary" id="getBeam">Download Beam</button>
    <div id="signup">
      <button class="btn provider" data-provider="Apple"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#12304D" d="M17.05 12.536c.031 3.36 2.948 4.478 2.98 4.492-.025.079-.466 1.593-1.537 3.157-.926 1.352-1.887 2.699-3.4 2.727-1.487.027-1.965-.881-3.665-.881-1.699 0-2.23.853-3.638.908-1.46.055-2.571-1.462-3.505-2.809-1.91-2.754-3.37-7.782-1.41-11.176.973-1.686 2.713-2.754 4.601-2.782 1.438-.027 2.795.964 3.674.964.879 0 2.529-1.192 4.257-1.017.724.031 2.757.292 4.063 2.2-.105.065-2.426 1.413-2.42 4.217M14.256 4.297c.776-.939 1.299-2.246 1.156-3.547-1.119.045-2.472.746-3.275 1.685-.719.831-1.348 2.16-1.178 3.435 1.247.097 2.521-.634 3.297-1.573Z"/></svg>Continue with Apple</button>
      <button class="btn provider" data-provider="Google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6C44.4 38.04 46.98 31.87 46.98 24.55Z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.87 23.87 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19Z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6C30.03 37.65 27.26 38.5 24 38.5c-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/></svg>Continue with Google</button>
      <button class="btn provider" data-provider="Email"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#12304D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M3 5h18v14H3V5 m0 1 9 7 9-7"/></svg>Continue with email</button>
    </div>
    <p id="signupNote" role="status"></p>
  </section>
</main>
<script>
(function(){
  var SUPABASE_URL='https://elbvuesmkcaywjygpsxq.supabase.co';
  // Public "anon" key: it can only call create_beam and get_beam (see the app's docs/supabase-setup.sql).
  var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsYnZ1ZXNta2NheXdqeWdwc3hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNDY5NjksImV4cCI6MjEwNDkyMjk2OX0.2i7bbmjtRL6OomJa9ARrSovjIdp1fkOaLFpAtyu09tw';
  var id=new URLSearchParams(location.search).get('id');
  var messageEl=document.getElementById('message'),noteEl=document.getElementById('note'),invite=document.getElementById('invite');
  function done(){invite.classList.add('show');}
  function show(text){
    // The sender's exact words, never trimmed or edited (DESIGN3 §3.5).
    messageEl.textContent=text;
    messageEl.className='message'+(text.length>160?' long':text.length>70?' medium':'');
    done();
  }
  function missing(){noteEl.textContent='The words in this Beam couldn’t be opened. Ask the sender to share it again.';noteEl.hidden=false;done();}
  document.getElementById('getBeam').addEventListener('click',function(){
    document.getElementById('signup').style.display='block';this.style.display='none';
  });
  Array.prototype.forEach.call(document.querySelectorAll('.provider'),function(btn){
    btn.addEventListener('click',function(){
      var note=document.getElementById('signupNote');
      note.style.display='block';
      note.textContent='This is a preview of signing up with '+btn.dataset.provider+'. Beam isn’t available to download yet, and no account was created.';
      document.getElementById('signup').style.display='none';
    });
  });
  if(!id){done();return;}
  fetch(SUPABASE_URL+'/rest/v1/rpc/get_beam',{
    method:'POST',
    headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({beam_id:id})
  }).then(function(r){return r.ok?r.json():[];}).then(function(rows){
    var row=rows&&rows[0];
    if(row&&row.message)show(row.message);else missing();
  }).catch(missing);
})();
</script>
</body>
</html>
